name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · unit tests · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc -b
      - name: Unit tests with coverage thresholds
        run: npx vitest run --coverage
      - name: Per-file coverage floor
        run: npm run coverage:floor
      - name: i18n catalogue is up to date
        run: npm run i18n:check
      - name: Production build
        run: npx vite build
      - name: Dependency audit (production deps)
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  docker:
    name: container image
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: zm-dashboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the image (SPA fallback, runtime config, asset caching)
        run: |
          docker run -d --name zm -p 8080:8080 -e ZM_API_URL=http://127.0.0.1:9 zm-dashboard:ci
          sleep 2
          curl -fsS -o /dev/null http://localhost:8080/events/1
          curl -fsS http://localhost:8080/config.js | grep -q __ZM_CONFIG__
          asset=$(curl -s http://localhost:8080/ | grep -o 'assets/[^"]*\.js' | head -1)
          curl -fsSI "http://localhost:8080/$asset" | grep -qi immutable
