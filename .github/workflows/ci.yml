name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · unit tests · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc -b
      - name: Unit tests with coverage thresholds
        run: npx vitest run --coverage
      - name: Per-file coverage floor
        run: npm run coverage:floor
      - name: i18n catalogue is up to date
        run: npm run i18n:check
      - name: Production build
        run: npx vite build
      - name: Bundle budget (initial download)
        run: npm run bundle:budget
      - name: Dependency audit (production deps)
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  docker:
    name: container image
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: zm-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the image (SPA fallback, runtime config, asset caching)
        run: |
          docker run -d --name zm -p 8080:8080 -e ZM_API_URL=http://127.0.0.1:9 zm-web:ci
          sleep 2
          curl -fsS -o /dev/null http://localhost:8080/events/1
          curl -fsS http://localhost:8080/config.js | grep -q __ZM_CONFIG__
          asset=$(curl -s http://localhost:8080/ | grep -o 'assets/[^"]*\.js' | head -1)
          curl -fsSI "http://localhost:8080/$asset" | grep -qi immutable

  e2e-seeded:
    name: e2e (seeded)
    runs-on: ubuntu-latest
    # A cold rust-cache spends ~19 min building zm_api before a test runs.
    # At 45 the job was cancelled mid-suite, which also meant the cache never
    # saved — so the next run paid the same 19 min again.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { path: zm-web }
      - uses: actions/checkout@v4
        with:
          repository: SteveGilvarry/zm-api
          path: zm_api
      - uses: actions/setup-node@v4
        with:
          node-version-file: zm-web/.nvmrc
          cache: npm
          cache-dependency-path: zm-web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: zm_api }
      - name: ffmpeg dev libraries (zm_api build)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang libavcodec-dev libavformat-dev \
            libavutil-dev libswscale-dev libavfilter-dev libavdevice-dev
      - run: npm ci
        working-directory: zm-web
      # webkit too: the `mobile` project is an iPhone 13 profile, which
      # Playwright runs on WebKit. Installing only chromium failed all twelve
      # of its tests at launch — and did so invisibly until the job started
      # getting far enough to run them.
      - run: npx playwright install --with-deps chromium webkit
        working-directory: zm-web

      - name: MariaDB + schema + seed
        run: npm run e2e:seed:up
        working-directory: zm-web
        env:
          ZM_API_DIR: ${{ github.workspace }}/zm_api

      # Compile before starting, so the health-check window below measures
      # boot time and not a cold-cache release build — which is what it was
      # measuring the first time this workflow ran, and why it failed at 6
      # minutes with cargo still compiling dependencies.
      - name: Build zm_api
        run: cargo build --release --locked
        working-directory: zm_api

      - name: Start zm_api against the seeded database
        run: |
          npm run e2e:seed:api -- --release > "$RUNNER_TEMP/zm_api.log" 2>&1 &
          for _ in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8089/api/v3/server/health_check >/dev/null; then
              echo "zm_api healthy"; exit 0
            fi
            sleep 2
          done
          echo "zm_api never became healthy"; tail -100 "$RUNNER_TEMP/zm_api.log"; exit 1
        working-directory: zm-web
        env:
          ZM_API_DIR: ${{ github.workspace }}/zm_api

      # Playwright starts its own Vite dev server on :5174; the global setup
      # fails fast with instructions if the stack is not up.
      - name: Seeded e2e (chromium + 390px)
        run: npm run test:e2e:seeded:ci
        working-directory: zm-web
        env:
          E2E_MODE: seeded
          E2E_WORKERS: '2'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-seeded
          path: |
            zm-web/playwright-report
            zm-web/test-results
          retention-days: 7
      # `always()`, not `failure()`: a cancelled job (the 45-minute timeout hit
      # once) skipped this and took the API's own log with it.
      - if: always()
        run: tail -200 "$RUNNER_TEMP/zm_api.log" || true
