# Cut a release from a tag.
#
#   npm version minor -m 'release: %s'   # or edit package.json by hand
#   git push --follow-tags
#
# The tag is the trigger and the source of truth: the job refuses to run if
# it disagrees with package.json, because a container labelled v0.9.0 built
# from a tree that says 0.8.0 is worse than no release at all.
#
# Publishes a multi-arch image to GHCR and a GitHub release whose body is the
# matching CHANGELOG section. Nothing here re-runs the test suite — the tag
# must point at a commit CI has already passed, which `verify` checks.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  verify:
    name: tag agrees with the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag but package.json says $pkg"
            exit 1
          fi
          echo "version $pkg"
      - name: CHANGELOG has a section for it
        run: |
          tag="${GITHUB_REF_NAME#v}"
          grep -q "^## \[$tag\]" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no '## [$tag]' section"
            exit 1
          }
      - name: The commit passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag can point anywhere; a release must not be the first time
          # the tree is built. Require a successful CI run for this SHA.
          conclusion=$(gh api \
            "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&status=completed" \
            --jq '[.workflow_runs[] | select(.name == "ci")] | first | .conclusion // "none"')
          echo "ci for this sha: $conclusion"
          [ "$conclusion" = "success" ] || {
            echo "::error::no successful ci run for ${{ github.sha }}"
            exit 1
          }

  publish:
    name: image + release
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Release notes from the CHANGELOG
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # The section for this version, up to the next '## ' heading.
          # index(), not a regex: the heading is "## [0.9.0]" and those
          # brackets are a character class to awk, which silently matches
          # nothing and ships an empty release body.
          awk -v v="## [$tag]" '
            index($0, v) == 1 {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "---"
            echo "Container: \`docker pull ghcr.io/${{ github.repository }}:$tag\`"
            echo "Deployment: [docs/DEPLOYMENT.md](https://github.com/${{ github.repository }}/blob/$GITHUB_REF_NAME/docs/DEPLOYMENT.md)"
          } >> notes.md
          test -s notes.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') || startsWith(github.ref_name, 'v0.') }}
